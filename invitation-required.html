<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Invitation Required</title>

<link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Great+Vibes&family=Playfair+Display:wght@400;500&display=swap"
    rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            #fffdf9 0%,
            #fdfaf6 55%,
            #f4ead9 100%
        );

    color: #3c3028;

    font-family:
        "Cormorant Garamond",
        serif;
}

.box {
    width: min(500px, 92vw);

    padding: 55px 35px;

    background:
        rgba(255,255,255,.78);

    border:
        1px solid rgba(198,162,82,.35);

    border-radius: 12px;

    box-shadow:
        0 20px 60px
        rgba(74,55,30,.08);
}

.names {
    font-family:
        "Great Vibes",
        cursive;

    font-size: 58px;

    color: #b08b32;

    margin-bottom: 25px;
}

.title {
    font-family:
        "Playfair Display",
        serif;

    text-transform: uppercase;

    letter-spacing: 4px;

    font-size: 13px;

    color: #a67c00;

    margin-bottom: 20px;
}

p {
    font-size: 19px;

    line-height: 1.6;

    color: #6e5c4e;

    margin: 0;
}

</style>
</head>

<body>

<div class="box">

    <div class="names">
        Nishi & Manu
    </div>

    <div class="title">
        Invitation Required
    </div>

    <p>
        This is a private wedding invitation.
        Please use the personal invitation link
        that was sent to you.
    </p>

</div>

</body>
</html>
